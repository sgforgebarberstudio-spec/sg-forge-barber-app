<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SG Forge - Barber Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-black text-gray-100 min-h-screen font-sans pb-12">

  <header class="border-b border-zinc-800 bg-zinc-950 p-4 flex justify-between items-center max-w-4xl mx-auto sticky top-0 z-50">
    <div>
      <h1 class="text-xl font-black uppercase text-white tracking-wider">SG FORGE</h1>
      <p class="text-xs text-zinc-400">Barber Studio</p>
    </div>
    <div>
      <button onclick="openMyAppointmentsModal()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 py-2 px-3.5 rounded-xl border border-zinc-800 transition flex items-center gap-2 font-bold">
        <i data-lucide="calendar" class="w-4 h-4 text-emerald-400"></i> Часове
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 mt-6 space-y-6">
    <!-- Основен екран за запазване на час -->
    <div id="booking-section" class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl space-y-6 max-w-lg mx-auto">
      <h2 class="text-lg font-bold text-white uppercase tracking-wider text-center">Запази час</h2>
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2 text-center">Избери дата</label>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-center text-xs"></div>
      </div>

      <div id="slots-container" class="hidden space-y-3">
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 text-center">Избери свободен час</label>
        <div id="slots-grid" class="grid grid-cols-3 gap-2"></div>
      </div>

      <!-- Форма за данни -->
      <div id="client-form" class="hidden space-y-4 pt-2 border-t border-zinc-800">
        <p id="selected-slot-info" class="text-xs text-emerald-400 font-bold text-center"></p>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Име и Фамилия</label>
          <input type="text" id="client-name" placeholder="Въведете име..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-zinc-500" />
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Телефонен номер</label>
          <input type="tel" id="client-phone" placeholder="089xxxxxxx" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-zinc-500" />
        </div>
        <button onclick="confirmBooking()" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3 rounded-xl transition text-sm">
          Потвърди резервацията
        </button>
      </div>
    </div>
  </main>

  <!-- Модален прозорец "Моите запазени часове" -->
  <div id="my-appointments-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center">
        <h3 class="text-md font-bold text-white uppercase tracking-wider">Моите запазени часове</h3>
        <button onclick="closeMyAppointmentsModal()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-1.5 px-3 rounded-lg border border-zinc-700 transition">Назад</button>
      </div>

      <div id="phone-check-section" class="space-y-3 pt-2">
        <p class="text-xs text-zinc-400">Въведете вашия телефонен номер, за да видите активните си часове:</p>
        <div class="flex gap-2">
          <input type="tel" id="check-phone-input" placeholder="089xxxxxxx" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-sm text-white focus:outline-none" />
          <button onclick="fetchClientAppointments()" class="bg-white hover:bg-zinc-200 text-black font-bold px-4 py-2.5 rounded-xl text-xs transition">Търси</button>
        </div>
      </div>

      <div id="client-appointments-list" class="space-y-3 max-h-64 overflow-y-auto pr-1 divide-y divide-zinc-800/60"></div>
    </div>
  </div>

  <footer class="text-center text-xs text-zinc-600 mt-12">
    SG FORGE BARBER STUDIO &copy; 2026
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCDniksfxmA5GU04nLzrmumt2AFp4_LxMA",
      authDomain: "sgforge-barber-studio.firebaseapp.com",
      projectId: "sgforge-barber-studio",
      storageBucket: "sgforge-barber-studio.firebasestorage.app",
      messagingSenderId: "207826077800",
      appId: "1:207826077800:web:6e776663a44a20f8ee0cb5",
      measurementId: "G-8FNDXQC5VW"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let selectedDate = '';
    let selectedTime = '';
    let scheduleSettings = { startTime: "09:00", endTime: "19:00", serviceDuration: 30, cleanDuration: 15, breakStart: "13:00", breakEnd: "14:00" };
    let daysOffList = [];

    window.onload = () => {
      loadSettingsAndDaysOff();
    };

    function loadSettingsAndDaysOff() {
      db.collection('settings').doc('schedule').get().then(doc => {
        if (doc.exists) scheduleSettings = doc.data();
      });
      db.collection('settings').doc('daysOff').get().then(doc => {
        if (doc.exists && doc.data().dates) daysOffList = doc.data().dates;
        renderCalendar();
      });
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = d.toLocaleDateString('bg-BG', { weekday: 'short' });
        const isOff = daysOffList.includes(dateStr);
        const isPast = dateStr < todayStr;

        const btn = document.createElement('button');
        const isSelected = selectedDate === dateStr;

        if (isOff || isPast) {
          btn.className = 'p-2.5 rounded-xl border bg-black/20 text-zinc-700 border-zinc-900 cursor-not-allowed flex flex-col items-center opacity-40 text-xs';
          btn.innerHTML = `<span class="uppercase font-bold text-[9px]">${isOff ? 'Почивка' : 'Мин.'}</span><span class="font-bold line-through">${day}</span>`;
          btn.disabled = true;
        } else {
          btn.className = `p-2.5 rounded-xl border flex flex-col items-center transition active:scale-95 text-xs ${isSelected ? 'bg-white text-black border-white shadow-md font-bold' : 'bg-zinc-950 text-zinc-300 border-zinc-800 hover:border-zinc-700'}`;
          btn.innerHTML = `<span class="uppercase font-bold text-[9px] ${isSelected ? 'text-zinc-600' : 'text-zinc-500'}">${dayName}</span><span class="font-bold">${day}</span>`;
          btn.onclick = () => {
            selectedDate = dateStr;
            selectedTime = '';
            document.getElementById('client-form').classList.add('hidden');
            renderCalendar();
            fetchTimeSlots();
          };
        }
        grid.appendChild(btn);
      }
    }

    function generateTimeSlots() {
      const slots = [];
      const totalSlotTime = scheduleSettings.serviceDuration + scheduleSettings.cleanDuration;
      let [h, m] = scheduleSettings.startTime.split(':').map(Number);
      let [endH, endM] = scheduleSettings.endTime.split(':').map(Number);
      let currentMin = h * 60 + m;
      const endMin = endH * 60 + endM;

      let [bStartH, bStartM] = scheduleSettings.breakStart.split(':').map(Number);
      let [bEndH, bEndM] = scheduleSettings.breakEnd.split(':').map(Number);
      const breakStartMin = bStartH * 60 + bStartM;
      const breakEndMin = bEndH * 60 + bEndM;

      while (currentMin + scheduleSettings.serviceDuration <= endMin) {
        if (!(currentMin >= breakStartMin && currentMin < breakEndMin)) {
          const slotH = String(Math.floor(currentMin / 60)).padStart(2, '0');
          const slotM = String(currentMin % 60).padStart(2, '0');
          slots.push(`${slotH}:${slotM}`);
        }
        currentMin += totalSlotTime;
      }
      return slots;
    }

    function fetchTimeSlots() {
      document.getElementById('slots-container').classList.remove('hidden');
      const grid = document.getElementById('slots-grid');
      grid.innerHTML = '<p class="col-span-3 text-xs text-zinc-500 text-center py-4">Зареждане на часове...</p>';

      db.collection('bookings').where('date', '==', selectedDate).get().then(snapshot => {
        let booked = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (!data.status || data.status === 'pending' || data.status === 'attended') {
            booked.push(data.time);
          }
        });
        const slots = generateTimeSlots();

        grid.innerHTML = '';
        if (slots.length === 0) {
          grid.innerHTML = '<p class="col-span-3 text-xs text-zinc-500 text-center py-4">Няма свободни часове за тази дата.</p>';
          return;
        }

        slots.forEach(slot => {
          const isBooked = booked.includes(slot);
          const btn = document.createElement('button');

          if (isBooked) {
            btn.className = 'py-2.5 text-xs font-bold rounded-xl border bg-black/40 text-zinc-700 border-zinc-900 cursor-not-allowed line-through';
            btn.innerText = slot;
            btn.disabled = true;
          } else {
            const isSelected = selectedTime === slot;
            btn.className = `py-2.5 text-xs font-bold rounded-xl border transition active:scale-95 ${isSelected ? 'bg-white text-black border-white shadow-md' : 'bg-zinc-950 text-zinc-300 border-zinc-800 hover:border-zinc-700'}`;
            btn.innerText = slot;
            btn.onclick = () => {
              selectedTime = slot;
              fetchTimeSlots();
              document.getElementById('client-form').classList.remove('hidden');
              document.getElementById('selected-slot-info').innerText = `Избран час: ${selectedDate} в ${selectedTime}`;
            };
          }
          grid.appendChild(btn);
        });
      });
    }

    function confirmBooking() {
      const name = document.getElementById('client-name').value.trim();
      const phone = document.getElementById('client-phone').value.trim();

      if (!name || !phone) return alert('Моля попълнете име и телефонен номер!');

      db.collection('bookings').add({
        clientName: name,
        clientPhone: phone,
        date: selectedDate,
        time: selectedTime,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert('Часът е запазен успешно!');
        location.reload();
      }).catch(err => alert('Грешка при запазване: ' + err.message));
    }

    function openMyAppointmentsModal() {
      document.getElementById('my-appointments-modal').classList.remove('hidden');
    }

    function closeMyAppointmentsModal() {
      document.getElementById('my-appointments-modal').classList.add('hidden');
    }

    function fetchClientAppointments() {
      const phone = document.getElementById('check-phone-input').value.trim();
      const listContainer = document.getElementById('client-appointments-list');
      listContainer.innerHTML = '<p class="text-xs text-zinc-500 text-center py-4">Търсене на часове...</p>';

      if (!phone) return alert('Моля въведете телефонен номер!');

      db.collection('bookings').where('clientPhone', '==', phone).get().then(snapshot => {
        let items = [];
        snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));

        // ФИЛТЪР: Показваме само тези, които нямат статус или са в статус 'pending'.
        // Когато ти в админ панела ги маркираш като 'attended' или 'missed', те автоматично се скриват тук!
        items = items.filter(item => !item.status || item.status === 'pending');

        items.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));

        listContainer.innerHTML = '';
        if (items.length === 0) {
          listContainer.innerHTML = '<p class="text-xs text-zinc-500 text-center py-4">Няма активни запазени часове за този номер.</p>';
          return;
        }

        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'py-3 flex justify-between items-center text-xs';
          div.innerHTML = `
            <div>
              <p class="font-bold text-white text-sm">${item.date} в <span class="text-emerald-400">${item.time}</span></p>
              <p class="text-zinc-400">Клиент: ${item.clientName}</p>
            </div>
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg font-bold">Активен</span>
          `;
          listContainer.appendChild(div);
        });
      }).catch(err => {
        listContainer.innerHTML = `<p class="text-xs text-red-400 text-center py-4">Грешка: ${err.message}</p>`;
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
