<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SG Forge - Barber Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal { animation: modalScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen font-sans pb-12 overflow-x-hidden selection:bg-white selection:text-black">

  <!-- Премиум Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)]">
    <div class="relative flex flex-col items-center space-y-4 px-6 text-center">
      <div class="absolute -inset-12 bg-gradient-to-r from-zinc-800 via-zinc-700 to-zinc-900 rounded-full blur-3xl opacity-25 animate-pulse"></div>
      <div class="relative z-10 space-y-2 animate-fade-in-up">
        <h1 class="text-4xl sm:text-6xl font-black uppercase text-white tracking-[0.25em] drop-shadow-2xl">SG FORGE</h1>
        <p class="text-xs sm:text-sm uppercase text-zinc-400 tracking-[0.4em] font-semibold">Barber Studio</p>
      </div>
      <div class="relative z-10 w-36 h-1 bg-zinc-900 rounded-full overflow-hidden mt-6 border border-zinc-800/80">
        <div id="splash-progress" class="absolute top-0 left-0 h-full bg-white rounded-full w-0 transition-all duration-1000 ease-out shadow-[0_0_15px_rgba(255,255,255,0.9)]"></div>
      </div>
    </div>
  </div>

  <header class="border-b border-zinc-800 bg-zinc-950 p-4 flex justify-between items-center max-w-4xl mx-auto sticky top-0 z-50">
    <div>
      <h1 class="text-xl font-black uppercase text-white tracking-wider">SG FORGE</h1>
      <p class="text-xs text-zinc-400">Barber Studio</p>
    </div>
    <div class="flex items-center gap-2">
      <div id="auth-header-container"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 mt-6 space-y-6">
    <!-- Основен екран за запазване на час -->
    <div id="booking-section" class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl space-y-6 max-w-lg mx-auto">
      <h2 class="text-lg font-bold text-white uppercase tracking-wider text-center">Запази час</h2>
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2 text-center">Избери дата</label>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-center text-xs"></div>
      </div>

      <div id="slots-container" class="hidden space-y-3">
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 text-center">Избери свободен час</label>
        <div id="slots-grid" class="grid grid-cols-3 gap-2"></div>
      </div>

      <!-- Форма за данни -->
      <div id="client-form" class="hidden space-y-4 pt-2 border-t border-zinc-800">
        <p id="selected-slot-info" class="text-xs text-emerald-400 font-bold text-center"></p>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Име и Фамилия</label>
          <input type="text" id="client-name" placeholder="Въведете име..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-zinc-500" />
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Телефонен номер</label>
          <input type="tel" id="client-phone" placeholder="089xxxxxxx" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-zinc-500" />
        </div>
        <button onclick="confirmBooking()" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3 rounded-xl transition text-sm">
          Потвърди резервацията
        </button>
      </div>

      <!-- Съобщение ако не е влязъл -->
      <div id="login-required-msg" class="hidden text-center py-4 space-y-2 border-t border-zinc-800">
        <p class="text-xs text-zinc-400">Трябва да влезете в профила си, за да запазите час.</p>
        <button onclick="openAuthModal()" class="bg-white text-black font-bold text-xs py-2 px-4 rounded-xl hover:bg-zinc-200 transition">Вход / Регистрация</button>
      </div>
    </div>
  </main>

  <!-- Универсален модален прозорец за Известия -->
  <div id="alert-modal" class="fixed inset-0 bg-black/85 flex items-center justify-center hidden z-[140] p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl text-center animate-modal relative">
      <div id="alert-modal-icon" class="w-12 h-12 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto mb-2">
        <i data-lucide="alert-circle" class="w-6 h-6"></i>
      </div>
      <h3 id="alert-modal-title" class="text-md font-bold text-white uppercase tracking-wider">Внимание</h3>
      <p id="alert-modal-desc" class="text-xs text-zinc-400">Съобщение...</p>
      <button onclick="closeCustomAlert()" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-2.5 rounded-xl text-xs transition mt-2">
        Разбрах
      </button>
    </div>
  </div>

  <!-- Модален прозорец за Успешна Резервация -->
  <div id="success-modal" class="fixed inset-0 bg-black/85 flex items-center justify-center hidden z-[120] p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl text-center animate-modal relative">
      <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2">
        <i data-lucide="check" class="w-6 h-6"></i>
      </div>
      <h3 class="text-md font-bold text-white uppercase tracking-wider">Часът е запазен успешно!</h3>
      <p id="success-modal-desc" class="text-xs text-zinc-400">Очакваме Ви в SG Forge Studio.</p>
      <button onclick="closeSuccessModalAndReload()" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-2.5 rounded-xl text-xs transition mt-2">
        Супер, разбрах
      </button>
    </div>
  </div>

  <!-- Модален прозорец за Вход / Регистрация -->
  <div id="auth-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center">
        <h3 id="auth-modal-title" class="text-md font-bold text-white uppercase tracking-wider">Вход в профила</h3>
        <button onclick="closeAuthModal()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-1.5 px-3 rounded-lg border border-zinc-700 transition">Отказ</button>
      </div>

      <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
        <i data-lucide="globe" class="w-4 h-4"></i> Вход с Google
      </button>

      <div class="flex items-center my-2">
        <div class="flex-grow border-t border-zinc-800"></div>
        <span class="px-2 text-[10px] text-zinc-500 uppercase">или с имейл</span>
        <div class="flex-grow border-t border-zinc-800"></div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-[11px] text-zinc-400 mb-1">Имейл</label>
          <input type="email" id="auth-email" placeholder="name@example.com" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:outline-none" />
        </div>
        <div>
          <label class="block text-[11px] text-zinc-400 mb-1">Парола</label>
          <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:outline-none" />
          <div class="text-right mt-1.5">
            <button onclick="resetPassword()" type="button" class="text-[10px] text-zinc-500 hover:text-white underline transition">Забравена парола?</button>
          </div>
        </div>

        <div id="reg-phone-container" class="hidden">
          <label class="block text-[11px] text-zinc-400 mb-1">Телефонен номер (за SMS код)</label>
          <input type="tel" id="reg-phone" placeholder="+35989xxxxxxx" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:outline-none" />
        </div>

        <div id="sms-code-container" class="hidden space-y-2">
          <label class="block text-[11px] text-emerald-400 mb-1 font-bold">Въведете 6-цифрения код от SMS</label>
          <input type="text" id="sms-code" placeholder="123456" class="w-full bg-zinc-950 border border-emerald-500/50 rounded-xl p-2.5 text-xs text-white text-center font-mono tracking-widest focus:outline-none" />
          <button onclick="verifySmsCode()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">Потвърди кода</button>
        </div>

        <button id="auth-action-btn" onclick="handleEmailAuth()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2.5 rounded-xl text-xs transition">Вход</button>
      </div>

      <div class="text-center pt-2">
        <button onclick="toggleAuthMode()" id="auth-toggle-link" class="text-[11px] text-zinc-400 hover:text-white underline">Нямате профил? Регистрирайте се</button>
      </div>
    </div>
  </div>

  <div id="recaptcha-container"></div>

  <!-- Модален прозорец "Моите часове" -->
  <div id="my-appointments-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center pb-2 border-b border-zinc-800">
        <h3 class="text-md font-bold text-white uppercase tracking-wider">Моите запазени часове</h3>
        <button onclick="closeMyAppointmentsModal()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-1.5 px-3 rounded-lg border border-zinc-700 transition">Затвори</button>
      </div>
      <div id="client-appointments-list" class="space-y-3 overflow-y-auto pr-1 flex-grow">
        <p class="text-xs text-zinc-500 text-center py-4">Зареждане...</p>
      </div>
    </div>
  </div>

  <footer class="text-center text-xs text-zinc-600 mt-12">
    SG FORGE BARBER STUDIO &copy; 2026
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCDniksfxmA5GU04nLzrmumt2AFp4_LxMA",
      authDomain: "sgforge-barber-studio.firebaseapp.com",
      projectId: "sgforge-barber-studio",
      storageBucket: "sgforge-barber-studio.firebasestorage.app",
      messagingSenderId: "207826077800",
      appId: "1:207826077800:web:6e776663a44a20f8ee0cb5",
      measurementId: "G-8FNDXQC5VW"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let selectedDate = '';
    let selectedTime = '';
    let scheduleSettings = {};
    let daysOffList = [];
    let isRegisterMode = false;
    let confirmationResult = null;

    function showCustomAlert(title, message, isError = true) {
      document.getElementById('alert-modal-title').innerText = title;
      document.getElementById('alert-modal-desc').innerText = message;
      const iconContainer = document.getElementById('alert-modal-icon');
      if (isError) {
        iconContainer.className = 'w-12 h-12 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto mb-2';
        iconContainer.innerHTML = '<i data-lucide="alert-circle" class="w-6 h-6"></i>';
      } else {
        iconContainer.className = 'w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2';
        iconContainer.innerHTML = '<i data-lucide="check" class="w-6 h-6"></i>';
      }
      document.getElementById('alert-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeCustomAlert() {
      document.getElementById('alert-modal').classList.add('hidden');
    }

    window.onload = () => {
      const progressBar = document.getElementById('splash-progress');
      if (progressBar) setTimeout(() => { progressBar.style.width = '100%'; }, 80);

      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.transform = 'scale(1.06)';
          setTimeout(() => splash.remove(), 700);
        }
      }, 1200);

      loadSettingsAndDaysOff();
      
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
      });

      auth.onAuthStateChanged(user => {
        currentUser = user;
        updateHeaderAuthUI();
        if (currentUser) {
          loadUserProfile();
        }
      });
    };

    function loadUserProfile() {
      if (!currentUser) return;
      db.collection('users').doc(currentUser.uid).get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          const nameInput = document.getElementById('client-name');
          const phoneInput = document.getElementById('client-phone');
          if (nameInput && data.name) nameInput.value = data.name;
          if (phoneInput && data.phone) phoneInput.value = data.phone;
        }
      });
    }

    function updateHeaderAuthUI() {
      const container = document.getElementById('auth-header-container');
      const clientForm = document.getElementById('client-form');
      const loginReqMsg = document.getElementById('login-required-msg');

      if (currentUser) {
        container.innerHTML = `
          <div class="flex items-center gap-2">
            <button onclick="openMyAppointmentsModal()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 py-2 px-3 rounded-xl border border-zinc-800 transition flex items-center gap-1.5 font-bold">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-400"></i> Часове
            </button>
            <button onclick="logoutUser()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-red-400 py-2 px-3 rounded-xl border border-zinc-800 transition">
              Изход
            </button>
          </div>
        `;
        if (selectedTime) clientForm.classList.remove('hidden');
        loginReqMsg.classList.add('hidden');
      } else {
        container.innerHTML = `
          <button onclick="openAuthModal()" class="text-xs bg-white hover:bg-zinc-200 text-black font-bold py-2 px-3.5 rounded-xl transition">
            Вход / Регистрация
          </button>
        `;
        clientForm.classList.add('hidden');
        if (selectedTime) loginReqMsg.classList.remove('hidden');
      }
      lucide.createIcons();
    }

    function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('sms-code-container').classList.add('hidden');
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-modal-title').innerText = isRegisterMode ? 'Регистрация с телефонен код' : 'Вход в профила';
      document.getElementById('auth-action-btn').innerText = isRegisterMode ? 'Изпрати SMS код' : 'Вход';
      document.getElementById('auth-toggle-link').innerText = isRegisterMode ? 'Вече имате профил? Влезте' : 'Нямате профил? Регистрирайте се';
      
      const phoneContainer = document.getElementById('reg-phone-container');
      if (isRegisterMode) {
        phoneContainer.classList.remove('hidden');
      } else {
        phoneContainer.classList.add('hidden');
        document.getElementById('sms-code-container').classList.add('hidden');
      }
    }

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(() => {
        closeAuthModal();
      }).catch(err => showCustomAlert('Грешка при Google вход', err.message));
    }

    function handleEmailAuth() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (!email || !password) return showCustomAlert('Внимание', 'Попълнете имейл и парола!');

      if (isRegisterMode) {
        const phone = document.getElementById('reg-phone').value.trim();
        if (!phone) return showCustomAlert('Внимание', 'Моля, въведете телефонен номер за верификация!');

        const appVerifier = window.recaptchaVerifier;
        
        auth.signInWithPhoneNumber(phone, appVerifier)
          .then(result => {
            confirmationResult = result;
            document.getElementById('sms-code-container').classList.remove('hidden');
            document.getElementById('auth-action-btn').classList.add('hidden');
            showCustomAlert('SMS Изпратен', 'Въведете 6-цифрения код, получен на вашия телефон.', false);
          })
          .catch(error => {
            showCustomAlert('Грешка при SMS', error.message);
          });
      } else {
        auth.signInWithEmailAndPassword(email, password).then(() => {
          closeAuthModal();
        }).catch(err => showCustomAlert('Грешка при вход', err.message));
      }
    }

    function verifySmsCode() {
      const code = document.getElementById('sms-code').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();

      if (!code) return showCustomAlert('Внимание', 'Въведете кода от съобщението!');

      if (confirmationResult) {
        confirmationResult.confirm(code).then(() => {
          auth.createUserWithEmailAndPassword(email, password)
            .then(userCred => {
              db.collection('users').doc(userCred.user.uid).set({
                email: email,
                phone: phone,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              closeAuthModal();
              showCustomAlert('Успех', 'Регистрацията е успешна!', false);
            })
            .catch(err => showCustomAlert('Грешка при създаване на профил', err.message));
        }).catch(() => {
          showCustomAlert('Грешка', 'Грешен код за верификация.');
        });
      }
    }

    function logoutUser() {
      auth.signOut().then(() => { location.reload(); });
    }

    function loadSettingsAndDaysOff() {
      db.collection('settings').doc('schedule').get().then(doc => {
        if (doc.exists) scheduleSettings = doc.data();
      });
      db.collection('settings').doc('daysOff').get().then(doc => {
        if (doc.exists && doc.data().dates) daysOffList = doc.data().dates;
        renderCalendar();
      });
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const dayName = d.toLocaleDateString('bg-BG', { weekday: 'short' });
        const isOff = daysOffList.includes(dateStr);
        const isPast = dateStr < todayStr;

        const btn = document.createElement('button');
        const isSelected = selectedDate === dateStr;

        if (isOff || isPast) {
          btn.className = 'p-2.5 rounded-xl border bg-black/20 text-zinc-700 border-zinc-900 cursor-not-allowed flex flex-col items-center opacity-40 text-xs';
          btn.innerHTML = `<span class="uppercase font-bold text-[9px]">${isOff ? 'Почивка' : 'Мин.'}</span><span class="font-bold line-through">${day}</span>`;
          btn.disabled = true;
        } else {
          btn.className = `p-2.5 rounded-xl border flex flex-col items-center transition active:scale-95 text-xs ${isSelected ? 'bg-white text-black border-white shadow-md font-bold' : 'bg-zinc-950 text-zinc-300 border-zinc-800 hover:border-zinc-700'}`;
          btn.innerHTML = `<span class="uppercase font-bold text-[9px] ${isSelected ? 'text-zinc-600' : 'text-zinc-500'}">${dayName}</span><span class="font-bold">${day}</span>`;
          btn.onclick = () => {
            selectedDate = dateStr;
            selectedTime = '';
            document.getElementById('client-form').classList.add('hidden');
            renderCalendar();
            fetchTimeSlots();
          };
        }
        grid.appendChild(btn);
      }
    }

    // НОВО: Функция за извличане и показване на свободните часове за избраната дата
    function fetchTimeSlots() {
      const container = document.getElementById('slots-container');
      const grid = document.getElementById('slots-grid');
      container.classList.remove('hidden');
      grid.innerHTML = '<p class="text-xs text-zinc-500 col-span-3 text-center py-2">Зареждане на часове...</p>';

      db.collection('bookings').where('date', '==', selectedDate).get().then(snapshot => {
        const bookedTimes = [];
        snapshot.forEach(doc => {
          if (doc.data().status !== 'cancelled') {
            bookedTimes.push(doc.data().time);
          }
        });

        // Стандартни часове (можеш да ги промениш според графика)
        const defaultSlots = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];
        grid.innerHTML = '';

        defaultSlots.forEach(time => {
          const isBooked = bookedTimes.includes(time);
          const btn = document.createElement('button');
          const isSelected = selectedTime === time;

          if (isBooked) {
            btn.className = 'p-2 rounded-xl border bg-zinc-900/40 text-zinc-600 border-zinc-900 cursor-not-allowed text-xs line-through';
            btn.innerText = time;
            btn.disabled = true;
          } else {
            btn.className = `p-2 rounded-xl border transition text-xs font-bold ${isSelected ? 'bg-white text-black border-white' : 'bg-zinc-950 text-zinc-300 border-zinc-800 hover:border-zinc-700'}`;
            btn.innerText = time;
            btn.onclick = () => {
              selectedTime = time;
              fetchTimeSlots();
              const clientForm = document.getElementById('client-form');
              if (currentUser) {
                clientForm.classList.remove('hidden');
              } else {
                document.getElementById('login-required-msg').classList.remove('hidden');
              }
              document.getElementById('selected-slot-info').innerText = `Избран час: ${selectedDate} в ${selectedTime}`;
            };
          }
          grid.appendChild(btn);
        });
      });
    }

    function confirmBooking() {
      if (!currentUser) return showCustomAlert('Внимание', 'Моля влезте в профила си!');
      const name = document.getElementById('client-name').value.trim();
      const phone = document.getElementById('client-phone').value.trim();

      if (!name || !phone) return showCustomAlert('Внимание', 'Моля попълнете име и телефонен номер!');

      db.collection('users').doc(currentUser.uid).set({
        name: name,
        phone: phone,
        email: currentUser.email || ''
      }, { merge: true }).then(() => {
        return db.collection('bookings').add({
          userId: currentUser.uid,
          clientEmail: currentUser.email || '',
          clientName: name,
          clientPhone: phone,
          date: selectedDate,
          time: selectedTime,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).then(() => {
        document.getElementById('success-modal-desc').innerText = `Успешно запазен час за ${selectedDate} в ${selectedTime}.`;
        document.getElementById('success-modal').classList.remove('hidden');
      });
    }

    function closeSuccessModalAndReload() { location.reload(); }

    // НОВО: Функция за отваряне и пълнене на модалния прозорец "Моите часове"
    function openMyAppointmentsModal() {
      document.getElementById('my-appointments-modal').classList.remove('hidden');
      const listContainer = document.getElementById('client-appointments-list');
      listContainer.innerHTML = '<p class="text-xs text-zinc-500 text-center py-4">Зареждане...</p>';

      if (!currentUser) return;

      db.collection('bookings').where('userId', '==', currentUser.uid).get().then(snapshot => {
        listContainer.innerHTML = '';
        if (snapshot.empty) {
          listContainer.innerHTML = '<p class="text-xs text-zinc-500 text-center py-4">Нямате запазени часове.</p>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement('div');
          div.className = 'bg-zinc-950 border border-zinc-800 p-3 rounded-xl flex justify-between items-center text-xs';
          div.innerHTML = `
            <div>
              <p class="font-bold text-white">${data.date} в ${data.time}</p>
              <p class="text-[10px] text-zinc-400">Статус: <span class="text-emerald-400">Активен</span></p>
            </div>
            <button onclick="cancelBooking('${doc.id}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-2.5 py-1 rounded-lg transition">Откажи</button>
          `;
          listContainer.appendChild(div);
        });
      });
    }

    function closeMyAppointmentsModal() {
      document.getElementById('my-appointments-modal').classList.add('hidden');
    }

    function cancelBooking(bookingId) {
      if (confirm('Сигурни ли сте, че искате да отмените този час?')) {
        db.collection('bookings').doc(bookingId).delete().then(() => {
          openMyAppointmentsModal();
        });
      }
    }

    function resetPassword() {
      const email = document.getElementById('auth-email').value.trim();
      if (!email) return showCustomAlert('Внимание', 'Въведете имейл адрес първо.');
      auth.sendPasswordResetEmail(email).then(() => {
        showCustomAlert('Изпратено', 'Линкът за възстановяване е изпратен на вашия имейл.', false);
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
