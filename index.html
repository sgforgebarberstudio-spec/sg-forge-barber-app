<!DOCTYPE html>
<html lang="bg" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SG Forge Barber Studio</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* Скриване на скролбарите за чисто приложение */
    ::-webkit-scrollbar { display: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-black text-gray-100 h-full flex flex-col justify-between font-sans selection:bg-zinc-800">

  <!-- Mobile Header -->
  <header class="border-b border-zinc-900 bg-black/80 backdrop-blur-xl sticky top-0 z-50 px-5 py-4 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-black tracking-widest uppercase text-white">SG FORGE</h1>
      <p class="text-[10px] tracking-[0.3em] text-zinc-500 uppercase">Barber Studio</p>
    </div>
    <div id="header-user-actions" class="hidden flex items-center gap-2">
      <button onclick="openMyBookings()" class="text-xs bg-zinc-900 active:scale-95 text-zinc-300 px-3 py-1.5 rounded-full border border-zinc-800 transition flex items-center gap-1.5 shadow-sm">
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-400"></i> Часове
      </button>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto px-4 py-6 flex-1 flex flex-col justify-center">
    
    <!-- СТЪПКА 1: Вход -->
    <div id="step-1" class="hidden bg-zinc-950 border border-zinc-900 rounded-3xl p-6 shadow-2xl space-y-5 animate-fade-in">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-zinc-900 border border-zinc-800 rounded-2xl mx-auto flex items-center justify-center mb-3 shadow-inner">
          <i data-lucide="scissors" class="w-6 h-6 text-white"></i>
        </div>
        <h2 class="text-xl font-bold text-white tracking-tight">Добре дошли</h2>
        <p class="text-xs text-zinc-400">Влезте за запазване и управление на часове</p>
      </div>

      <button onclick="loginWithGoogle()" class="w-full bg-zinc-900 hover:bg-zinc-800 active:scale-[0.98] border border-zinc-800 text-white font-semibold py-3.5 rounded-2xl flex items-center justify-center gap-2.5 transition text-xs shadow-lg">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.4-.7-.8-1.5-.8-2.3z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
        Продължи с Google
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-zinc-900"></div>
        <span class="flex-shrink mx-3 text-[10px] text-zinc-600 uppercase tracking-widest font-bold">Или с имейл</span>
        <div class="flex-grow border-t border-zinc-900"></div>
      </div>

      <form class="space-y-3">
        <input type="email" id="auth-email" placeholder="Имейл адрес"
          class="w-full bg-black border border-zinc-900 rounded-2xl py-3 px-4 text-xs text-white focus:outline-none focus:border-zinc-700 transition" />
        <input type="password" id="auth-password" placeholder="Парола"
          class="w-full bg-black border border-zinc-900 rounded-2xl py-3 px-4 text-xs text-white focus:outline-none focus:border-zinc-700 transition" />
        <input type="tel" id="auth-phone" placeholder="Телефонен номер (напр. 089xxxxxxx)"
          class="w-full bg-black border border-zinc-900 rounded-2xl py-3 px-4 text-xs text-white focus:outline-none focus:border-zinc-700 transition" />
        
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button type="button" onclick="loginWithEmail()" class="w-full bg-white text-black font-bold py-3 rounded-2xl active:scale-[0.98] hover:bg-zinc-200 transition text-xs shadow-md">Вход</button>
          <button type="button" onclick="registerWithEmail()" class="w-full bg-zinc-900 text-zinc-300 font-bold py-3 rounded-2xl active:scale-[0.98] hover:bg-zinc-800 transition text-xs border border-zinc-800">Регистрация</button>
        </div>
      </form>
    </div>

    <!-- СТЪПКА 2: Календар и Запазване на час -->
    <div id="step-2" class="hidden bg-zinc-950 border border-zinc-900 rounded-3xl p-6 shadow-2xl space-y-5 animate-fade-in">
      
      <!-- Профилен хедър в стъпката -->
      <div class="flex justify-between items-center bg-black/40 border border-zinc-900/80 p-3.5 rounded-2xl">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-xs font-bold text-white" id="user-initials">S</div>
          <div>
            <p class="text-[10px] uppercase text-zinc-500 font-semibold">Профил</p>
            <p id="user-display-name" class="text-xs font-bold text-white truncate max-w-[160px]"></p>
          </div>
        </div>
        <button onclick="firebase.auth().signOut()" class="text-[11px] text-zinc-500 hover:text-white transition px-2 py-1">Изход</button>
      </div>

      <!-- Избор на дата -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2.5">Избери дата</label>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-center text-xs"></div>
      </div>

      <!-- Свободни часове -->
      <div id="slots-container" class="hidden space-y-2.5">
        <label class="block text-[11px] font-bold uppercase tracking-wider text-zinc-400">Свободни часове</label>
        <div id="slots-grid" class="grid grid-cols-3 gap-2 max-h-44 overflow-y-auto pr-1"></div>
      </div>

      <!-- Телефон за връзка -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Телефон за връзка</label>
        <input type="tel" id="booking-phone" placeholder="089xxxxxxx" class="w-full bg-black border border-zinc-900 rounded-2xl py-3 px-4 text-xs text-white focus:outline-none focus:border-zinc-700 transition" />
      </div>

      <button id="confirm-btn" disabled onclick="saveBooking()"
        class="w-full bg-white text-black font-bold py-3.5 rounded-2xl active:scale-[0.98] disabled:opacity-30 disabled:active:scale-100 hover:bg-zinc-200 transition text-xs shadow-xl">
        Запази час
      </button>
    </div>

    <!-- СТЪПКА ЗА МОИТЕ РЕЗЕРВАЦИИ -->
    <div id="step-my-bookings" class="hidden bg-zinc-950 border border-zinc-900 rounded-3xl p-6 shadow-2xl space-y-4 animate-fade-in">
      <div class="flex justify-between items-center border-b border-zinc-900 pb-3">
        <h2 class="text-sm font-bold text-white uppercase tracking-wider">Моите запазени часове</h2>
        <button onclick="goToStep(2)" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-xl border border-zinc-800 transition">Назад</button>
      </div>
      <div id="my-bookings-list" class="divide-y divide-zinc-900 max-h-72 overflow-y-auto">
        <p class="text-xs text-zinc-600 text-center py-6">Зареждане...</p>
      </div>
    </div>

    <!-- СТЪПКА 3: Потвърждение -->
    <div id="step-3" class="hidden bg-zinc-950 border border-zinc-900 rounded-3xl p-8 shadow-2xl text-center space-y-5 animate-fade-in">
      <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 rounded-full flex items-center justify-center mx-auto text-emerald-400 shadow-inner">
        <i data-lucide="check" class="w-8 h-8"></i>
      </div>
      <div class="space-y-1">
        <h2 class="text-xl font-bold text-white">Часът е запазен!</h2>
        <p class="text-xs text-zinc-400">
          Очакваме ви на <strong id="confirm-date" class="text-white"></strong> в <strong id="confirm-time" class="text-white"></strong> ч.
        </p>
      </div>
      <button onclick="goToStep(2)" class="w-full bg-zinc-900 text-white font-semibold py-3 rounded-2xl active:scale-[0.98] hover:bg-zinc-800 transition text-xs border border-zinc-800 shadow-lg">
        Нова резервация
      </button>
    </div>

  </main>

  <footer class="border-t border-zinc-900/80 py-4 text-center text-[10px] text-zinc-600 uppercase tracking-widest">
    SG Forge Barber Studio © 2026
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCDniksfxmA5GU04nLzrmumt2AFp4_LxMA",
      authDomain: "sgforge-barber-studio.firebaseapp.com",
      projectId: "sgforge-barber-studio",
      storageBucket: "sgforge-barber-studio.firebasestorage.app",
      messagingSenderId: "207826077800",
      appId: "1:207826077800:web:6e776663a44a20f8ee0cb5",
      measurementId: "G-8FNDXQC5VW"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let selectedDate = '';
    let selectedTime = '';
    let scheduleSettings = { startTime: "09:00", endTime: "19:00", serviceDuration: 30, cleanDuration: 15, breakStart: "13:00", breakEnd: "14:00" };
    let daysOffList = [];

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        const name = user.displayName || user.email.split('@')[0];
        document.getElementById('user-display-name').innerText = name;
        document.getElementById('user-initials').innerText = name.charAt(0).toUpperCase();
        document.getElementById('header-user-actions').classList.remove('hidden');
        
        loadAppData().then(() => {
          renderCalendar();
          goToStep(2);
        });
      } else {
        currentUser = null;
        document.getElementById('header-user-actions').classList.add('hidden');
        goToStep(1);
      }
    });

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert(err.message));
    }

    function registerWithEmail() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      const phone = document.getElementById('auth-phone').value;
      if (!email || !pass) return alert("Въведете имейл и парола");
      auth.createUserWithEmailAndPassword(email, pass).then(cred => {
        if(phone) document.getElementById('booking-phone').value = phone;
      }).catch(err => alert(err.message));
    }

    function loginWithEmail() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      if (!email || !pass) return alert("Въведете имейл и парола");
      auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
    }

    async function loadAppData() {
      const settingsDoc = await db.collection('settings').doc('schedule').get();
      if (settingsDoc.exists) scheduleSettings = settingsDoc.data();

      const daysOffDoc = await db.collection('settings').doc('daysOff').get();
      if (daysOffDoc.exists && daysOffDoc.data().dates) {
        daysOffList = daysOffDoc.data().dates;
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      const today = new Date();
      
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = d.toLocaleDateString('bg-BG', { weekday: 'short' });
        const dayNum = d.getDate();
        const isOff = daysOffList.includes(dateStr);

        const btn = document.createElement('button');
        const isSelected = selectedDate === dateStr;

        if (isOff) {
          btn.className = 'p-2.5 rounded-2xl border bg-black/20 text-zinc-700 border-zinc-900 cursor-not-allowed flex flex-col items-center opacity-40';
          btn.innerHTML = `<span class="text-[9px] uppercase font-bold text-zinc-600">Почивка</span><span class="text-xs font-bold line-through">${dayNum}</span>`;
          btn.disabled = true;
        } else {
          btn.className = `p-2.5 rounded-2xl border flex flex-col items-center transition active:scale-95 ${isSelected ? 'bg-white text-black border-white shadow-lg' : 'bg-black text-zinc-300 border-zinc-900 hover:border-zinc-800'}`;
          btn.innerHTML = `<span class="text-[9px] uppercase font-bold ${isSelected ? 'text-zinc-500' : 'text-zinc-600'}">${dayName}</span><span class="text-xs font-bold">${dayNum}</span>`;
          btn.onclick = () => {
            selectedDate = dateStr;
            renderCalendar();
            fetchAndRenderSlots();
          };
        }
        grid.appendChild(btn);
      }
    }

    function generateTimeSlots() {
      const slots = [];
      const totalSlotTime = scheduleSettings.serviceDuration + scheduleSettings.cleanDuration;
      let [h, m] = scheduleSettings.startTime.split(':').map(Number);
      let [endH, endM] = scheduleSettings.endTime.split(':').map(Number);
      let currentMin = h * 60 + m;
      const endMin = endH * 60 + endM;

      let [bStartH, bStartM] = scheduleSettings.breakStart.split(':').map(Number);
      let [bEndH, bEndM] = scheduleSettings.breakEnd.split(':').map(Number);
      const breakStartMin = bStartH * 60 + bStartM;
      const breakEndMin = bEndH * 60 + bEndM;

      while (currentMin + scheduleSettings.serviceDuration <= endMin) {
        if (!(currentMin >= breakStartMin && currentMin < breakEndMin)) {
          const slotH = String(Math.floor(currentMin / 60)).padStart(2, '0');
          const slotM = String(currentMin % 60).padStart(2, '0');
          slots.push(`${slotH}:${slotM}`);
        }
        currentMin += totalSlotTime;
      }
      return slots;
    }

    function fetchAndRenderSlots() {
      document.getElementById('slots-container').classList.remove('hidden');
      const grid = document.getElementById('slots-grid');
      grid.innerHTML = '<p class="col-span-3 text-[11px] text-zinc-600 text-center py-3">Зареждане на часове...</p>';

      db.collection('bookings').where('date', '==', selectedDate).get().then(snapshot => {
        const booked = snapshot.docs.map(doc => doc.data().time);
        const slots = generateTimeSlots();

        grid.innerHTML = '';
        slots.forEach(slot => {
          const isBooked = booked.includes(slot);
          const btn = document.createElement('button');

          if (isBooked) {
            btn.className = 'py-2.5 text-xs font-bold rounded-xl border bg-black/40 text-zinc-700 border-zinc-900 cursor-not-allowed line-through';
            btn.innerText = slot;
            btn.disabled = true;
          } else {
            const isSelected = selectedTime === slot;
            btn.className = `py-2.5 text-xs font-bold rounded-xl border transition active:scale-95 ${isSelected ? 'bg-white text-black border-white shadow-md' : 'bg-black text-zinc-300 border-zinc-900'}`;
            btn.innerText = slot;
            btn.onclick = () => {
              selectedTime = slot;
              fetchAndRenderSlots();
              document.getElementById('confirm-btn').disabled = false;
            };
          }
          grid.appendChild(btn);
        });
      });
    }

    function saveBooking() {
      const phone = document.getElementById('booking-phone').value;
      if (!phone) return alert('Моля въведете телефонен номер!');

      db.collection('bookings').add({
        clientUid: currentUser.uid,
        clientName: currentUser.displayName || currentUser.email.split('@')[0],
        clientEmail: currentUser.email,
        clientPhone: phone,
        date: selectedDate,
        time: selectedTime,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('confirm-date').innerText = selectedDate;
        document.getElementById('confirm-time').innerText = selectedTime;
        goToStep(3);
      });
    }

    function openMyBookings() {
      goToStep('my-bookings');
      const container = document.getElementById('my-bookings-list');
      container.innerHTML = '<p class="text-xs text-zinc-600 text-center py-6">Зареждане...</p>';

      db.collection('bookings').where('clientUid', '==', currentUser.uid).get().then(snapshot => {
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = '<p class="text-xs text-zinc-600 text-center py-6">Нямате активни резервации.</p>';
          return;
        }
        let items = [];
        snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
        items.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

        items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'py-3.5 flex justify-between items-center text-xs';
          row.innerHTML = `
            <div>
              <p class="font-bold text-white text-sm">${item.date} в <span class="text-emerald-400">${item.time}</span></p>
              <p class="text-zinc-500 text-[11px] mt-0.5">Телефон: ${item.clientPhone}</p>
            </div>
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full text-[10px] font-bold">Активен</span>
          `;
          container.appendChild(row);
        });
      });
    }

    function goToStep(step) {
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-3').classList.add('hidden');
      document.getElementById('step-my-bookings').classList.add('hidden');
      
      if(step === 'my-bookings') {
        document.getElementById('step-my-bookings').classList.remove('hidden');
      } else {
        document.getElementById(`step-${step}`).classList.remove('hidden');
      }
    }

    lucide.createIcons();
  </script>
</body>
</html>
