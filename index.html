<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG FORGE - Онлай Резервация</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Хедър -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-scissors text-amber-500 text-xl"></i>
                <h1 class="font-bold text-lg tracking-wider">SG FORGE <span class="text-xs text-amber-500 block">BARBER STUDIO</span></h1>
            </div>
            <button onclick="toggleMyBookings()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg border border-slate-700 text-slate-300 transition">
                <i class="fa-solid fa-ticket mr-1"></i> Моите часове
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Студио статус банер -->
        <div id="statusBanner" class="p-3 rounded-xl text-center text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
            <i class="fa-solid fa-clock mr-1"></i> Зареждане на статус...
        </div>

        <!-- Форма за резервация -->
        <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="space-y-6">
            
            <!-- Стъпка 1: Избор на услуга -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <h2 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">1. Избери услуга</h2>
                <div class="space-y-2">
                    <label class="flex items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-950/50 hover:border-amber-500/50 cursor-pointer transition">
                        <div class="flex items-center gap-3">
                            <input type="radio" name="service" value="Mъжко подстригване" data-price="25 лв." checked class="accent-amber-500">
                            <span class="font-medium text-sm">Мъжко подстригване</span>
                        </div>
                        <span class="text-amber-400 font-bold text-sm">25 лв.</span>
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-950/50 hover:border-amber-500/50 cursor-pointer transition">
                        <div class="flex items-center gap-3">
                            <input type="radio" name="service" value="Оформяне на брада" data-price="15 лв." class="accent-amber-500">
                            <span class="font-medium text-sm">Оформяне на брада</span>
                        </div>
                        <span class="text-amber-400 font-bold text-sm">15 лв.</span>
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl border border-slate-800 bg-slate-950/50 hover:border-amber-500/50 cursor-pointer transition">
                        <div class="flex items-center gap-3">
                            <input type="radio" name="service" value="Комбо (Коса + Брада)" data-price="35 лв." class="accent-amber-500">
                            <span class="font-medium text-sm">Комбо (Коса + Брада)</span>
                        </div>
                        <span class="text-amber-400 font-bold text-sm">35 лв.</span>
                    </label>
                </div>
            </div>

            <!-- Стъпка 2: Избор на дата и час -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <h2 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">2. Избери дата и час</h2>
                
                <input type="date" id="selectedDate" onchange="renderTimeSlots()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 mb-4 focus:outline-none focus:border-amber-500">

                <div id="timeSlotsContainer" class="grid grid-cols-4 gap-2">
                    <!-- Часовете се генерират диначино -->
                </div>
                <input type="hidden" id="selectedTime" required>
            </div>

            <!-- Стъпка 3: Контакти -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <h2 class="text-sm font-semibold text-slate-400 mb-1 uppercase tracking-wider">3. Твоите данни</h2>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Име и Фамилия</label>
                    <input type="text" id="clientName" required placeholder="Иван Иванов" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Телефонен номер</label>
                    <input type="tel" id="clientPhone" required placeholder="0888123456" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-4 rounded-xl shadow-lg transition text-center">
                Потвърди резервацията
            </button>
        </form>

        <!-- Модален прозорец: Моите резервации -->
        <div id="myBookingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg text-slate-100">Моите резервации</h3>
                    <button onclick="toggleMyBookings()" class="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>
                <div class="flex gap-2">
                    <input type="tel" id="searchPhone" placeholder="Въведи телефон..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200">
                    <button onclick="searchBookings()" class="bg-amber-500 text-slate-950 font-bold px-4 rounded-xl text-sm">Търси</button>
                </div>
                <div id="myBookingsList" class="space-y-2 pt-2">
                    <p class="text-xs text-slate-500 text-center">Въведете телефонен номер за преглед.</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        const STORAGE_KEYS = {
            BOOKINGS: 'sgforge_bookings',
            SETTINGS: 'sgforge_settings',
            BLOCKED_DATES: 'sgforge_blocked_dates'
        };

        const defaultSettings = {
            workDays: { start: "09:00", end: "19:00" },
            sunday: { enabled: false, start: "10:00", end: "16:00" },
            slotDuration: 30
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('selectedDate').value = today;
            document.getElementById('selectedDate').min = today;
            renderTimeSlots();
            updateStatusBanner();
        });

        function getSettings() {
            const saved = localStorage.getItem(STORAGE_KEYS.SETTINGS);
            return saved ? JSON.parse(saved) : defaultSettings;
        }

        function getBlockedDates() {
            const saved = localStorage.getItem(STORAGE_KEYS.BLOCKED_DATES);
            return saved ? JSON.parse(saved) : [];
        }

        function getBookings() {
            const saved = localStorage.getItem(STORAGE_KEYS.BOOKINGS);
            return saved ? JSON.parse(saved) : [];
        }

        function updateStatusBanner() {
            const blocked = getBlockedDates();
            const todayStr = new Date().toISOString().split('T')[0];
            const banner = document.getElementById('statusBanner');

            if (blocked.includes(todayStr)) {
                banner.className = "p-3 rounded-xl text-center text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
                banner.innerHTML = `<i class="fa-solid fa-ban mr-1"></i> Студиото днес е в почивен ден!`;
            } else {
                banner.className = "p-3 rounded-xl text-center text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                banner.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Студиото приема резервации!`;
            }
        }

        function renderTimeSlots() {
            const selectedDateStr = document.getElementById('selectedDate').value;
            const container = document.getElementById('timeSlotsContainer');
            document.getElementById('selectedTime').value = '';
            container.innerHTML = '';

            if (!selectedDateStr) return;

            const settings = getSettings();
            const blocked = getBlockedDates();
            const bookings = getBookings();

            if (blocked.includes(selectedDateStr)) {
                container.innerHTML = `<p class="col-span-4 text-center text-xs text-red-400 py-4">Датата е маркирана като почивен ден!</p>`;
                return;
            }

            const dateObj = new Date(selectedDateStr + "T00:00:00");
            const isSunday = dateObj.getDay() === 0;

            let hours = settings.workDays;
            if (isSunday) {
                if (!settings.sunday.enabled) {
                    container.innerHTML = `<p class="col-span-4 text-center text-xs text-amber-400 py-4">Неделя е почивен ден за студиото.</p>`;
                    return;
                }
                hours = settings.sunday;
            }

            let [startH, startM] = hours.start.split(':').map(Number);
            let [endH, endM] = hours.end.split(':').map(Number);
            let current = startH * 60 + startM;
            const end = endH * 60 + endM;

            let availableCount = 0;

            while (current + settings.slotDuration <= end) {
                const h = Math.floor(current / 60).toString().padStart(2, '0');
                const m = (current % 60).toString().padStart(2, '0');
                const timeSlot = `${h}:${m}`;

                const isTaken = bookings.some(b => 
                    b.date === selectedDateStr && 
                    b.time === timeSlot && 
                    b.status !== 'cancelled'
                );

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = timeSlot;

                if (isTaken) {
                    btn.className = "p-2 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-600 cursor-not-allowed line-through";
                    btn.disabled = true;
                } else {
                    availableCount++;
                    btn.className = "time-btn p-2 text-xs font-semibold rounded-xl border border-slate-800 bg-slate-950 text-slate-200 hover:border-amber-500 hover:text-amber-400 transition";
                    btn.onclick = () => selectSlot(btn, timeSlot);
                }

                container.appendChild(btn);
                current += settings.slotDuration;
            }

            if (availableCount === 0 && !container.innerHTML) {
                container.innerHTML = `<p class="col-span-4 text-center text-xs text-slate-500 py-4">Няма свободни часове за тази дата.</p>`;
            }
        }

        function selectSlot(btnElement, time) {
            document.querySelectorAll('.time-btn').forEach(b => {
                b.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-500');
                b.classList.add('bg-slate-950', 'text-slate-200');
            });
            btnElement.classList.remove('bg-slate-950', 'text-slate-200');
            btnElement.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-500');
            document.getElementById('selectedTime').value = time;
        }

        function handleBookingSubmit(e) {
            e.preventDefault();
            const selectedTime = document.getElementById('selectedTime').value;

            if (!selectedTime) {
                alert('Моля, избери час от таблицата!');
                return;
            }

            const serviceRadio = document.querySelector('input[name="service"]:checked');
            const clientName = document.getElementById('clientName').value.trim();
            const clientPhone = document.getElementById('clientPhone').value.trim();
            const selectedDate = document.getElementById('selectedDate').value;

            const newBooking = {
                id: 'BK-' + Date.now(),
                clientName,
                clientPhone,
                service: serviceRadio.value,
                price: serviceRadio.dataset.price,
                date: selectedDate,
                time: selectedTime,
                status: 'confirmed',
                createdAt: new Date().toISOString()
            };

            const currentBookings = getBookings();
            currentBookings.push(newBooking);
            localStorage.setItem(STORAGE_KEYS.BOOKINGS, JSON.stringify(currentBookings));

            // Известяване на админ панела в друг раздел
            window.dispatchEvent(new Event('storage'));

            alert(`Успешна резервация!\nДата: ${selectedDate} в ${selectedTime} ч.\nКод: ${newBooking.id}`);
            
            document.getElementById('bookingForm').reset();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('selectedDate').value = today;
            renderTimeSlots();
        }

        function toggleMyBookings() {
            const modal = document.getElementById('myBookingsModal');
            modal.classList.toggle('hidden');
        }

        function searchBookings() {
            const phone = document.getElementById('searchPhone').value.trim();
            const list = document.getElementById('myBookingsList');
            if (!phone) return;

            const bookings = getBookings().filter(b => b.clientPhone.includes(phone));

            if (bookings.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">Няма намерени резервации за този номер.</p>`;
                return;
            }

            list.innerHTML = bookings.map(b => `
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs flex justify-between items-center">
                    <div>
                        <div class="font-bold text-amber-400">${b.service}</div>
                        <div class="text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${b.date} в ${b.time} ч.</div>
                    </div>
                    <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${
                        b.status === 'confirmed' ? 'bg-emerald-500/20 text-emerald-400' : 
                        b.status === 'completed' ? 'bg-blue-500/20 text-blue-400' : 'bg-red-500/20 text-red-400'
                    }">${b.status === 'confirmed' ? 'Потвърден' : b.status === 'completed' ? 'Завършен' : 'Отказан'}</span>
                </div>
            `).join('');
        }

        // Синхронизация при промяна от Админ Панела
        window.addEventListener('storage', () => {
            renderTimeSlots();
            updateStatusBanner();
        });
    </script>
</body>
</html>
