<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SG Forge - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal {
      animation: modalScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen font-sans pb-12 overflow-x-hidden selection:bg-white selection:text-black">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-950 p-4 flex justify-between items-center max-w-4xl mx-auto sticky top-0 z-50">
    <div>
      <h1 class="text-xl font-black uppercase text-white tracking-wider">SG FORGE</h1>
      <p id="txt-subtitle" class="text-xs text-zinc-400">Административен Панел</p>
    </div>
    <div class="flex items-center gap-2">
      <!-- Бутон за смяна на език -->
      <button onclick="toggleLanguage()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-200 py-2 px-3 rounded-xl border border-zinc-800 transition flex items-center gap-1.5 font-bold">
        <i data-lucide="globe" class="w-3.5 h-3.5 text-emerald-400"></i>
        <span id="lang-btn-text">ES 🇪🇸</span>
      </button>
      <button onclick="logoutAdmin()" id="txt-logout" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-red-400 py-2 px-3 rounded-xl border border-zinc-800 transition">
        Изход
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 mt-6 space-y-6">
    <!-- Настройки на график -->
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl space-y-5 max-w-lg mx-auto">
      <div class="flex items-center gap-2 pb-2 border-b border-zinc-800">
        <i data-lucide="settings" class="w-5 h-5 text-zinc-400"></i>
        <h2 id="txt-settings-title" class="text-sm font-bold text-white uppercase tracking-wider">Настройки на график & дезинфекция</h2>
      </div>
      
      <div class="space-y-4">
        <div>
          <label id="txt-start-time" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Начало на деня</label>
          <input type="time" id="set-start" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-zinc-500 font-bold text-center" />
        </div>
        <div>
          <label id="txt-end-time" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Край на деня</label>
          <input type="time" id="set-end" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-zinc-500 font-bold text-center" />
        </div>
        <div>
          <label id="txt-service-dur" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Подстригване (минути)</label>
          <input type="number" id="set-duration" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-zinc-500 font-bold text-center" />
        </div>
        <div>
          <label id="txt-clean-dur" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Дезинфекция (минути)</label>
          <input type="number" id="set-clean" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-zinc-500 font-bold text-center" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label id="txt-break-start" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Почивка от</label>
            <input type="time" id="set-break-start" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-zinc-500 font-bold text-center" />
          </div>
          <div>
            <label id="txt-break-end" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Почивка до</label>
            <input type="time" id="set-break-end" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-zinc-500 font-bold text-center" />
          </div>
        </div>

        <button onclick="saveScheduleSettings()" id="txt-save-btn" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3.5 rounded-xl transition text-sm shadow-lg">
          Запази новия график
        </button>
      </div>
    </div>
  </main>

  <!-- Универсален Стилен Модален прозорец за Известия -->
  <div id="alert-modal" class="fixed inset-0 bg-black/85 flex items-center justify-center hidden z-[140] p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl text-center animate-modal relative">
      <div id="alert-modal-icon" class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2">
        <i data-lucide="check" class="w-6 h-6"></i>
      </div>
      <h3 id="alert-modal-title" class="text-md font-bold text-white uppercase tracking-wider">Успешно</h3>
      <p id="alert-modal-desc" class="text-xs text-zinc-400">Промените са запазени.</p>
      <button onclick="closeCustomAlert()" id="txt-modal-ok" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-2.5 rounded-xl text-xs transition mt-2">
        Разбрах
      </button>
    </div>
  </div>

  <footer class="text-center text-xs text-zinc-600 mt-12">
    SG FORGE BARBER STUDIO &copy; 2026
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCDniksfxmA5GU04nLzrmumt2AFp4_LxMA",
      authDomain: "sgforge-barber-studio.firebaseapp.com",
      projectId: "sgforge-barber-studio",
      storageBucket: "sgforge-barber-studio.firebasestorage.app",
      messagingSenderId: "207826077800",
      appId: "1:207826077800:web:6e776663a44a20f8ee0cb5",
      measurementId: "G-8FNDXQC5VW"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Речник с преводи (Български / Испански)
    const translations = {
      bg: {
        subtitle: "Административен Панел",
        logout: "Изход",
        langBtn: "ES 🇪🇸",
        settingsTitle: "Настройки на график & дезинфекция",
        startTime: "Начало на деня",
        endTime: "Край на деня",
        serviceDuration: "Подстригване (минути)",
        cleanDuration: "Дезинфекция (минути)",
        breakStart: "Почивка от",
        breakEnd: "Почивка до",
        saveBtn: "Запази новия график",
        modalOk: "Разбрах",
        alertSuccessTitle: "Успешно",
        alertSuccessDesc: "Графикът е запазен успешно!",
        alertErrorTitle: "Внимание",
        alertErrorDesc: "Възникна грешка при запазване."
      },
      es: {
        subtitle: "Panel Administrativo",
        logout: "Salir",
        langBtn: "BG 🇧🇬",
        settingsTitle: "Configuración de Horarios y Limpieza",
        startTime: "Inicio del día",
        endTime: "Fin del día",
        serviceDuration: "Corte (minutos)",
        cleanDuration: "Limpieza (minutos)",
        breakStart: "Descanso de",
        breakEnd: "Descanso hasta",
        saveBtn: "Guardar nuevo horario",
        modalOk: "Entendido",
        alertSuccessTitle: "Éxito",
        alertSuccessDesc: "¡El horario se ha guardado correctamente!",
        alertErrorTitle: "Atención",
        alertErrorDesc: "Ocurrió un error al guardar."
      }
    };

    let currentLang = localStorage.getItem('sg_admin_lang') || 'bg';

    function toggleLanguage() {
      currentLang = currentLang === 'bg' ? 'es' : 'bg';
      localStorage.setItem('sg_admin_lang', currentLang);
      applyTranslations();
    }

    function applyTranslations() {
      const t = translations[currentLang];
      document.getElementById('txt-subtitle').innerText = t.subtitle;
      document.getElementById('txt-logout').innerText = t.logout;
      document.getElementById('lang-btn-text').innerText = t.langBtn;
      document.getElementById('txt-settings-title').innerText = t.settingsTitle;
      document.getElementById('txt-start-time').innerText = t.startTime;
      document.getElementById('txt-end-time').innerText = t.endTime;
      document.getElementById('txt-service-dur').innerText = t.serviceDuration;
      document.getElementById('txt-clean-dur').innerText = t.cleanDuration;
      document.getElementById('txt-break-start').innerText = t.breakStart;
      document.getElementById('txt-break-end').innerText = t.breakEnd;
      document.getElementById('txt-save-btn').innerText = t.saveBtn;
      document.getElementById('txt-modal-ok').innerText = t.modalOk;
    }

    function showCustomAlert(title, message, isSuccess = true) {
      const t = translations[currentLang];
      document.getElementById('alert-modal-title').innerText = title;
      document.getElementById('alert-modal-desc').innerText = message;
      
      const iconContainer = document.getElementById('alert-modal-icon');
      if (isSuccess) {
        iconContainer.className = 'w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2';
        iconContainer.innerHTML = '<i data-lucide="check" class="w-6 h-6"></i>';
      } else {
        iconContainer.className = 'w-12 h-12 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto mb-2';
        iconContainer.innerHTML = '<i data-lucide="alert-circle" class="w-6 h-6"></i>';
      }
      
      document.getElementById('alert-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeCustomAlert() {
      document.getElementById('alert-modal').classList.add('hidden');
    }

    window.onload = () => {
      applyTranslations();
      loadSettings();
    };

    function loadSettings() {
      db.collection('settings').doc('schedule').get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data.startTime) document.getElementById('set-start').value = data.startTime;
          if (data.endTime) document.getElementById('set-end').value = data.endTime;
          if (data.serviceDuration) document.getElementById('set-duration').value = data.serviceDuration;
          if (data.cleanDuration) document.getElementById('set-clean').value = data.cleanDuration;
          if (data.breakStart) document.getElementById('set-break-start').value = data.breakStart;
          if (data.breakEnd) document.getElementById('set-break-end').value = data.breakEnd;
        }
      });
    }

    function saveScheduleSettings() {
      const startTime = document.getElementById('set-start').value;
      const endTime = document.getElementById('set-end').value;
      const serviceDuration = Number(document.getElementById('set-duration').value);
      const cleanDuration = Number(document.getElementById('set-clean').value);
      const breakStart = document.getElementById('set-break-start').value;
      const breakEnd = document.getElementById('set-break-end').value;

      db.collection('settings').doc('schedule').set({
        startTime, endTime, serviceDuration, cleanDuration, breakStart, breakEnd
      }, { merge: true }).then(() => {
        const t = translations[currentLang];
        showCustomAlert(t.alertSuccessTitle, t.alertSuccessDesc, true);
      }).catch(err => {
        const t = translations[currentLang];
        showCustomAlert(t.alertErrorTitle, err.message, false);
      });
    }

    function logoutAdmin() {
      auth.signOut().then(() => {
        location.reload();
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
