<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">SG Forge - Административен Панел</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    body { background-color: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Admin Login Modal -->
  <div id="admin-login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 max-w-xs w-full space-y-4">
      <div class="text-center space-y-1">
        <h2 id="txt-login-title" class="font-black text-lg text-white">Административен достъп</h2>
        <p id="txt-login-desc" class="text-xs text-zinc-400">Въведете секретния код:</p>
      </div>
      <input type="password" id="admin-pass-input" placeholder="Парола..." class="w-full bg-black border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-zinc-500 text-center tracking-widest">
      <button id="txt-login-btn" onclick="checkAdminPassword()" class="w-full bg-white text-black font-extrabold py-2.5 rounded-xl text-xs hover:bg-zinc-200">
        Вход
      </button>
    </div>
  </div>

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-black/60 backdrop-blur-md sticky top-0 z-40 px-4 py-3.5">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="font-black text-base tracking-widest uppercase">SG FORGE</h1>
        <p id="txt-subtitle" class="text-xs text-zinc-400 font-semibold">Админ Панел</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleLanguage()" class="text-xs bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1">
          <span id="lang-btn-text">ES 🇪🇸</span>
        </button>
        <button id="txt-logout" onclick="adminLogout()" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-xl font-bold">
          Изход
        </button>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">

    <!-- Active Bookings -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h2 id="txt-active-bookings-title" class="text-sm font-extrabold text-white flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4 text-emerald-400"></i> Активни часове
        </h2>
        <span id="active-count" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded-full text-xs font-bold">0</span>
      </div>
      <div id="active-bookings-list" class="divide-y divide-zinc-800/60 max-h-80 overflow-y-auto"></div>
    </section>

    <!-- Schedule Settings -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
      <h2 id="txt-settings-title" class="text-sm font-extrabold text-white flex items-center gap-2">
        <i data-lucide="clock" class="w-4 h-4 text-white"></i> График (Пон - Съб)
      </h2>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label id="txt-start-time" class="block text-zinc-400 mb-1">Начало</label>
          <input type="time" id="set-start-time" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label id="txt-end-time" class="block text-zinc-400 mb-1">Край</label>
          <input type="time" id="set-end-time" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label id="txt-service-dur" class="block text-zinc-400 mb-1">Подстригване (мин)</label>
          <input type="number" id="set-service-duration" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label id="txt-clean-dur" class="block text-zinc-400 mb-1">Дезинфекция (мин)</label>
          <input type="number" id="set-clean-duration" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
      </div>

      <h2 id="txt-sunday-title" class="text-sm font-extrabold text-white pt-2 border-t border-zinc-800 flex items-center gap-2">
        <i data-lucide="sun" class="w-4 h-4 text-amber-400"></i> График (Неделя)
      </h2>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label id="txt-sun-start" class="block text-zinc-400 mb-1">Начало (Нед)</label>
          <input type="time" id="set-sun-start" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label id="txt-sun-end" class="block text-zinc-400 mb-1">Край (Нед)</label>
          <input type="time" id="set-sun-end" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label id="txt-sun-service" class="block text-zinc-400 mb-1">Подстригване (мин)</label>
          <input type="number" id="set-sun-service" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label id="txt-sun-clean" class="block text-zinc-400 mb-1">Дезинфекция (мин)</label>
          <input type="number" id="set-sun-clean" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
      </div>

      <button id="txt-save-btn" onclick="saveScheduleSettings()" class="w-full bg-white text-black font-extrabold py-3 rounded-xl text-xs hover:bg-zinc-200">
        Запази настройките
      </button>
    </section>

    <!-- Days Off -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
      <h2 id="txt-days-off-title" class="text-sm font-extrabold text-white flex items-center gap-2">
        <i data-lucide="calendar-x" class="w-4 h-4 text-red-400"></i> Почивни дни
      </h2>
      <div class="flex gap-2">
        <input type="date" id="day-off-input" class="bg-black border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white flex-1">
        <button id="txt-add-off-btn" onclick="addDayOff()" class="bg-white text-black font-bold px-4 py-2 rounded-xl text-xs hover:bg-zinc-200">
          Добави
        </button>
      </div>
      <div id="days-off-list" class="flex flex-wrap gap-2 pt-2"></div>
    </section>

    <!-- Manual Booking -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
      <h2 id="txt-manual-title" class="text-sm font-extrabold text-white flex items-center gap-2">
        <i data-lucide="user-plus" class="w-4 h-4 text-blue-400"></i> Ръчно добавяне на час
      </h2>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label id="txt-manual-name" class="block text-zinc-400 mb-1">Име</label>
          <input type="text" id="manual-client-name" placeholder="Име на клиент" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label id="txt-manual-phone" class="block text-zinc-400 mb-1">Телефон</label>
          <input type="tel" id="manual-client-phone" placeholder="089XXXXXXX" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
        <div class="col-span-2">
          <label id="txt-manual-date" class="block text-zinc-400 mb-1">Дата</label>
          <input type="date" id="manual-date" class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-white">
        </div>
      </div>
      <button id="txt-manual-btn" onclick="manuallyAddBooking()" class="w-full bg-white text-black font-extrabold py-3 rounded-xl text-xs hover:bg-zinc-200">
        Запиши
      </button>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCDniksfxmA5GU04nLzrmumt2AFp4_LxMA",
      authDomain: "sgforge-barber-studio.firebaseapp.com",
      projectId: "sgforge-barber-studio",
      storageBucket: "sgforge-barber-studio.firebasestorage.app",
      messagingSenderId: "207826077800",
      appId: "1:207826077800:web:6e776663a44a20f8ee0cb5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ADMIN_SECRET = "1234";
    let globalBookings = [];
    let currentDaysOff = [];

    const translations = {
      bg: {
        pageTitle: "SG Forge - Административен Панел", loginTitle: "Административен достъп",
        loginDesc: "Въведете секретния код:", loginBtn: "Вход", subtitle: "Админ Панел", logout: "Изход",
        langBtn: "ES 🇪🇸", settingsTitle: "График (Пон - Съб)", sundayTitle: "График (Неделя)",
        sunStart: "Начало (Нед)", sunEnd: "Край (Нед)", sunService: "Подстригване (мин)", sunClean: "Дезинфекция (мин)",
        startTime: "Начало", endTime: "Край", serviceDuration: "Подстригване (мин)", cleanDuration: "Дезинфекция (мин)",
        saveBtn: "Запази настройките", daysOffTitle: "Почивни дни", addOffBtn: "Добави",
        manualTitle: "Ръчно добавяне на час", manualName: "Име", manualPhone: "Телефон", manualDate: "Дата",
        manualBtn: "Запиши", activeBookingsTitle: "Активни часове", alertSaved: "Успешно запазено!"
      },
      es: {
        pageTitle: "SG Forge - Panel", loginTitle: "Acceso Admin",
        loginDesc: "Código secreto:", loginBtn: "Entrar", subtitle: "Panel Admin", logout: "Salir",
        langBtn: "BG 🇧🇬", settingsTitle: "Horario (Lun - Sáb)", sundayTitle: "Horario (Dom)",
        sunStart: "Inicio (Dom)", sunEnd: "Fin (Dom)", sunService: "Corte (min)", sunClean: "Limpieza (min)",
        startTime: "Inicio", endTime: "Fin", serviceDuration: "Corte (min)", cleanDuration: "Limpieza (min)",
        saveBtn: "Guardar ajustes", daysOffTitle: "Días libres", addOffBtn: "Añadir",
        manualTitle: "Añadir manual", manualName: "Nombre", manualPhone: "Teléfono", manualDate: "Fecha",
        manualBtn: "Guardar", activeBookingsTitle: "Citas activas", alertSaved: "¡Guardado con éxito!"
      }
    };

    let currentLang = 'bg';

    function toggleLanguage() {
      currentLang = currentLang === 'bg' ? 'es' : 'bg';
      applyTranslations();
    }

    function applyTranslations() {
      const t = translations[currentLang];
      document.getElementById('page-title').innerText = t.pageTitle;
      document.getElementById('txt-login-title').innerText = t.loginTitle;
      document.getElementById('txt-login-btn').innerText = t.loginBtn;
      document.getElementById('txt-subtitle').innerText = t.subtitle;
      document.getElementById('txt-logout').innerText = t.logout;
      document.getElementById('lang-btn-text').innerText = t.langBtn;
      document.getElementById('txt-save-btn').innerText = t.saveBtn;
      document.getElementById('txt-add-off-btn').innerText = t.addOffBtn;
      document.getElementById('txt-manual-btn').innerText = t.manualBtn;
    }

    function checkAdminPassword() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === ADMIN_SECRET) {
        document.getElementById('admin-login-modal').classList.add('hidden');
        loadData();
      } else {
        alert("Грешна парола!");
      }
    }
    function adminLogout() { location.reload(); }

    function loadData() {
      db.collection('settings').doc('schedule').onSnapshot(doc => {
        if(doc.exists) {
          const data = doc.data();
          document.getElementById('set-start-time').value = data.startTime || '10:00';
          document.getElementById('set-end-time').value = data.endTime || '22:00';
          document.getElementById('set-service-duration').value = data.serviceDuration || 60;
          document.getElementById('set-clean-duration').value = data.cleanDuration || 5;
          document.getElementById('set-sun-start').value = data.sunStartTime || '10:00';
          document.getElementById('set-sun-end').value = data.sunEndTime || '14:00';
          document.getElementById('set-sun-service').value = data.sunServiceDuration || 60;
          document.getElementById('set-sun-clean').value = data.sunCleanDuration || 5;
        }
      });

      db.collection('settings').doc('daysOff').onSnapshot(doc => {
        if(doc.exists) {
          currentDaysOff = doc.data().dates || [];
          renderDaysOff();
        }
      });

      db.collection('bookings').onSnapshot(snapshot => {
        globalBookings = [];
        snapshot.forEach(doc => globalBookings.push({ id: doc.id, ...doc.data() }));
        renderBookings();
      });
    }

    function saveScheduleSettings() {
      const settings = {
        startTime: document.getElementById('set-start-time').value,
        endTime: document.getElementById('set-end-time').value,
        serviceDuration: document.getElementById('set-service-duration').value,
        cleanDuration: document.getElementById('set-clean-duration').value,
        sunStartTime: document.getElementById('set-sun-start').value,
        sunEndTime: document.getElementById('set-sun-end').value,
        sunServiceDuration: document.getElementById('set-sun-service').value,
        sunCleanDuration: document.getElementById('set-sun-clean').value
      };
      db.collection('settings').doc('schedule').set(settings).then(() => {
        alert(translations[currentLang].alertSaved);
      });
    }

    function addDayOff() {
      const date = document.getElementById('day-off-input').value;
      if(!date) return alert('Изберете дата!');
      if(!currentDaysOff.includes(date)) {
        currentDaysOff.push(date);
        db.collection('settings').doc('daysOff').set({ dates: currentDaysOff });
      }
    }

    function removeDayOff(date) {
      currentDaysOff = currentDaysOff.filter(d => d !== date);
      db.collection('settings').doc('daysOff').set({ dates: currentDaysOff });
    }

    function renderDaysOff() {
      const list = document.getElementById('days-off-list');
      list.innerHTML = currentDaysOff.map(d => 
        `<span class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-2">
          ${d} <button onclick="removeDayOff('${d}')" class="hover:text-white">x</button>
        </span>`
      ).join('');
    }

    function renderBookings() {
      const list = document.getElementById('active-bookings-list');
      const active = globalBookings.filter(b => b.status === 'pending');
      document.getElementById('active-count').innerText = active.length;
      
      if(active.length === 0) {
        list.innerHTML = '<p class="text-xs text-zinc-500 py-4">Няма активни резервации.</p>';
        return;
      }
      
      list.innerHTML = active.map(b => `
        <div class="py-3 flex justify-between items-center text-sm border-b border-zinc-800">
          <div>
            <p class="text-white font-bold">${b.date} / ${b.time}</p>
            <p class="text-zinc-400 text-xs">${b.clientName} - ${b.clientPhone}</p>
          </div>
          <button onclick="db.collection('bookings').doc('${b.id}').update({status: 'cancelled'})" class="text-red-400 border border-red-500/30 px-3 py-1 rounded-lg text-xs hover:bg-red-500/10">Отмени</button>
        </div>
      `).join('');
    }

    function manuallyAddBooking() {
      const name = document.getElementById('manual-client-name').value;
      const phone = document.getElementById('manual-client-phone').value;
      const date = document.getElementById('manual-date').value;
      const time = prompt("Въведете час (напр. 15:00):"); 
      
      if(!name || !date || !time) return alert("Попълнете име, дата и час!");

      db.collection("bookings").add({
        userId: "admin-manual", clientName: name, clientPhone: phone,
        date: date, time: time, status: 'pending', createdAt: new Date()
      }).then(() => {
        alert("Часът е добавен успешно!");
        document.getElementById('manual-client-name').value = '';
        document.getElementById('manual-client-phone').value = '';
      });
    }

    window.onload = applyTranslations;
    lucide.createIcons();
  </script>
</body>
</html>
